aid: tahoe-therapeutics
name: Tahoe Therapeutics
description: >-
  Tahoe Therapeutics (formerly Vevo Therapeutics) is a South San Francisco
  digital-biology company building the "ground truth for biological
  superintelligence." Its Mosaic platform generates perturbative single-cell
  data in vivo at gigascale, and it trains AI models — including the Tahoe-x1
  single-cell foundation model (up to 3 billion parameters) and the Rhaister
  family of perturbation-response models — on the resulting data to discover
  novel drug targets and predict how patient cells respond to drugs. Tahoe
  openly publishes datasets (including the 100-million-cell Tahoe-100M atlas)
  and model weights on Hugging Face, ships the tahoe-x1 Python package on PyPI,
  and operates Tara, an autonomous research agent. The company does not run a
  public REST API. Backed by Amplify Partners; raised $30M in 2025.
